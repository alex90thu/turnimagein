name: pdf_compare
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # 1. 基础环境
  - python=3.10
  - pip
  
  # 2. PyTorch & CUDA (使用 Conda 安装最稳，自动处理 CUDA 驱动兼容)
  # 如果你的显卡比较旧，可以把 pytorch-cuda=12.1 改成 11.8
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # 3. 常用基础库 (Conda 安装)
  - requests
  - pillow
  
  # 4. Pip 专属库 (Sentence-Transformers 和 PyMuPDF 建议走 pip，更新更及时)
  - pip:
    - pymupdf
    - sentence-transformers
    - pypdf